<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PQ Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div>
            <h1>PQ Assistant</h1>
            <p>Agentic AI-Based Product Query Assistant</p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Query Section -->
        <section class="query-card">

            <h2>Ask a Product Query</h2>

            <textarea
                id="queryInput"
                class="query-input"
                placeholder="Enter your product-related question..."
                aria-label="Product query"
            ></textarea>

            <div class="button-group">

                <button
                    id="submitButton"
                    class="btn btn-primary"
                    type="button"
                >
                    Ask PQ Assistant
                </button>

                <button
                    id="clearButton"
                    class="btn btn-secondary"
                    type="button"
                >
                    Clear
                </button>

            </div>

            <!-- Loading Message -->
            <div
                id="loadingMessage"
                class="loading"
                role="status"
            >
                Processing your query...
            </div>

            <!-- Error Message -->
            <div
                id="errorMessage"
                class="error-message"
                role="alert"
            ></div>

        </section>


        <!-- Response Section -->
        <section class="response-card">

            <h2>Assistant Response</h2>

            <div
                id="responseContent"
                class="response-content"
            >
                Your answer will appear here.
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>
            PQ Assistant &copy; 2026 |
            Multi-Agent RAG Enterprise Knowledge Retrieval
        </p>
    </footer>


    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>
</html>
